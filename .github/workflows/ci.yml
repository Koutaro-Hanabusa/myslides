name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      # build を先に実行: next build が next-env.d.ts / .next/types を生成し、
      # 後段の type-aware lint で *.png 等のモジュール型を解決できるようにする。
      - name: Build
        run: vp run -r build
      - name: Lint
        run: vp lint
      - name: Format check
        run: vp fmt --check
