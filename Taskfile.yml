# https://taskfile.dev
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  new-slide:
    desc: Create a personal Slidev presentation
    cmds:
      - node scripts/new-slide.mjs personal {{.CLI_ARGS}}

  new-slide-corp:
    desc: Create a corporate Slidev presentation
    cmds:
      - node scripts/new-slide.mjs corporate {{.CLI_ARGS}}

  pdf:
    desc: Export a presentation to PDF using Slidev
    summary: |
      Usage:
        task pdf -- <slide-name>
        task pdf -- <slide-name> output.pdf

      Examples:
        task pdf -- tacotuesday
        task pdf -- better-t-stack my-slides.pdf

      Requirements:
        - Chromium must be installed: vp exec playwright install chromium
    cmds:
      - ./scripts/pdf-export.sh {{.CLI_ARGS}}
