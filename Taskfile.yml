# https://taskfile.dev
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  new-slide:
    desc: Create a personal Slidev presentation
    cmds:
      - node scripts/new-slide.mjs personal {{.CLI_ARGS}}

  new-slide-corp:
    desc: Create a corporate Slidev presentation
    cmds:
      - node scripts/new-slide.mjs corporate {{.CLI_ARGS}}

  enable-markdown-for-agents:
    desc: Enable Cloudflare Markdown for Agents on the zone
    summary: |
      Usage:
        task enable-markdown-for-agents

      Required env vars:
        CLOUDFLARE_API_TOKEN - API token with Zone Settings edit permission
        CLOUDFLARE_ZONE_ID   - Target zone ID

      Or configure via Cloudflare dashboard:
        AI > AI Crawl Control > Markdown for Agents → On
    cmds:
      - ./scripts/enable-markdown-for-agents.sh

  pdf:
    desc: Export a presentation to PDF using Slidev
    summary: |
      Usage:
        task pdf -- <slide-name>
        task pdf -- <slide-name> output.pdf

      Examples:
        task pdf -- tacotuesday
        task pdf -- better-t-stack my-slides.pdf

      Requirements:
        - Chromium must be installed: vp exec playwright install chromium
    cmds:
      - ./scripts/pdf-export.sh {{.CLI_ARGS}}
