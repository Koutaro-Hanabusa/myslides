# https://taskfile.dev
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  new-mdxslide:
    desc: Create a personal MDX presentation
    cmds:
      - node scripts/new-mdxslide.mjs personal {{.CLI_ARGS}}

  new-mdxslide-corp:
    desc: Create a corporate MDX presentation
    cmds:
      - node scripts/new-mdxslide.mjs corporate {{.CLI_ARGS}}

  pdf:
    desc: Export a presentation to PDF using decktape
    summary: |
      Usage:
        task pdf -- <slide-name>
        task pdf -- <slide-name> output.pdf

      Examples:
        task pdf -- tacotuesday
        task pdf -- better-t-stack my-slides.pdf

      Requirements:
        - decktape must be installed: npm install -g decktape
    cmds:
      - ./scripts/pdf-export.sh {{.CLI_ARGS}}
